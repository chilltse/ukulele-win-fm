program: wandb_kqn_train.py
method: bayes
metric:
    goal: maximize
    name: validauc
parameters:
    model_name:
        values: ["kqn"]
    dataset_name:
        values: ["xes"]
    emb_type:
        values: ["qid"]
    save_dir:
        values: ["models/kqn_tiaocan"]
    n_hidden:
        values: [128]
    n_rnn_hidden:
        values: [128]
    n_mlp_hidden:
        values: [128]
    n_rnn_layers:
        values: [1]
    learning_rate:
        values: [1e-3]
    dropout:
        values: [0.2]
    seed:
        values: [42]
    fold:
        values: [0, 1, 2, 3, 4]
 
