program: ./wandb_simplekt_train.py
method: bayes
metric:
    goal: maximize
    name: validauc
parameters:
    model_name:
        values: ["simplekt"]
    dataset_name:
        values: ["xes"]
    emb_type:
        values: ["qid"]
    save_dir:
        values: ["models/simplekt_tiaocan"]
    d_model:
        values: [256]
    d_ff:
        values: [256]
    final_fc_dim:
        values: [256]
    final_fc_dim2:
        values: [256]
    dropout:
        values: [0.1]
    learning_rate:
        values: [1e-4]
    num_attn_heads:
        values: [4]
    n_blocks:
        values: [2]
    seed:
        values: [42]
    fold:
        values: [0, 1, 2, 3, 4]
