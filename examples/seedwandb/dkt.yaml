program: wandb_dkt_train.py
method: grid
metric:
    goal: maximize
    name: validauc
parameters:
    model_name:
        values: ["dkt"]
    dataset_name:
        values: ["xes"]
    emb_type:
        values: ["qid"]
    save_dir:
        values: ["models/dkt_tiaocan"]
    emb_size:
        values: [200]
    learning_rate:
        values: [1e-3]
    dropout:
        values: [0.2]
    seed:
        values: [42]
    fold:
        values: [0, 1, 2, 3, 4]
