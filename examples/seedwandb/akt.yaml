program: wandb_akt_train.py
method: bayes
metric:
    goal: maximize
    name: validauc
parameters:
    model_name:
        values: ["akt"]
    dataset_name:
        values: ["xes"]
    emb_type:
        values: ["qid"]
    save_dir:
        values: ["models/akt_tiaocan"]
    d_model:
        values: [256]
    d_ff:
        values: [512]
    dropout:
        values: [0.2]
    learning_rate:
        values: [1e-4]
    num_attn_heads:
        values: [8]
    n_blocks:
        values: [4]
    seed:
        values: [3407]
    fold:
        values: [0, 1, 2, 3, 4]
