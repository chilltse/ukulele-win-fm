program:  wandb_sakt_train.py
method: bayes
metric:
    goal: maximize
    name: validauc
parameters:
    model_name:
        values: ["sakt"]
    dataset_name:
        values: ["xes"]
    emb_type:
        values: ["qid"]
    save_dir:
        values: ["models/sakt_tiaocan"]
    emb_size:
        values: [256]
    learning_rate:
        values: [1e-3]
    num_attn_heads:
        values: [8]
    dropout:
        values: [0.2]
    num_en:
        values: [1]
    seed:
        values: [42]
    fold:
        values: [0, 1, 2, 3, 4]
