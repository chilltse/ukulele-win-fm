program: wandb_dkt_plus_train.py
method: bayes
metric:
    goal: maximize
    name: validauc
parameters:
    model_name:
        values: ["dkt+"]
    dataset_name:
        values: ["xes"]
    emb_type:
        values: ["qid"]
    save_dir:
        values: ["models/dkt_plus_tiaocan"]
    emb_size:
        values: [200]
    learning_rate:
        values: [1e-3]
    lambda_r:
        values: [0.01]
    lambda_w1:
        values: [0.003]
    lambda_w2:
        values: [3.0]
    dropout:
        values: [0.2]
    seed:
        values: [42]
    fold:
        values: [0, 1, 2, 3, 4]
