program: wandb_iekt_train.py
method: bayes
metric:
    goal: maximize
    name: validauc
parameters:
    model_name:
        values: ["iekt"]
    dataset_name:
        values: ["xes"]
    emb_type:
        values: ["qid"]
    save_dir:
        values: ["models/iekt_tiaocan"]
    emb_size:
        values: [64]
    lamb:
        values: [40]
    n_layer:
        values: [1]
    cog_levels:
        values: [10]
    acq_levels:
        values: [10]
    gamma:
        values: [0.93]
    dropout:
        values: [0]
    learning_rate:
        values: [1e-3]
    seed:
        values: [42]
    fold:
        values: [0, 1, 2, 3, 4]
